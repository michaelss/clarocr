name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtesseract-dev \
            libleptonica-dev \
            libayatana-appindicator3-dev

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: make deb VERSION="$VERSION"

      - name: Store .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build golang gcc gcc-c++ make \
            pkgconf-pkg-config tesseract-devel leptonica-devel \
            libayatana-appindicator-gtk3-devel tar gzip findutils diffutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .rpm
        run: make rpm VERSION="${GITHUB_REF_NAME#v}"

      - name: Inspect .rpm
        run: |
          rpm -qpi dist/*.rpm
          rpm -qpl dist/*.rpm
          rpm -qpR dist/*.rpm

      - name: Store .rpm
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  verify-rpm:
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download .rpm
        uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist

      - name: Install and remove in clean Fedora 44
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 \
            sh -c 'sh packaging/rpm/smoke.sh /workspace/dist/*.rpm'

  publish:
    needs: [build-deb, verify-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: true
